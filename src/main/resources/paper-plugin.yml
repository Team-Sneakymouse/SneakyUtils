name: SneakyUtils
version: '${version}'
main: com.sneakyutils.SneakyUtils
description: Shared Paper utilities and managers for Team-Sneakymouse / Lords of Minecraft plugins.
api-version: '26.2'
authors: [Team Sneakymouse]
website: https://github.com/Team-Sneakymouse/SneakyUtils

dependencies:
  server:
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true
    # Optional: trigger timing during captures. SneakyDiagnostics depends on nothing of ours, so no cycle.
    SneakyDiagnostics:
      load: BEFORE
      required: false
      join-classpath: true

permissions:
  sneakyutils.command.triggers:
    description: Show trigger service stats and turn handler profiling on or off (/triggers).
    default: op
